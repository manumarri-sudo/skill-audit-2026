[project]
name = "skill-audit"
version = "0.1.0"
description = "Comprehensive static scanner for MCP / agent / skill text. Detects 26 attack classes from 2026 security research: Line Jumping, schema-vs-description mismatch, consent bypass, tool commandeering, conversation exfiltration, and more."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manu Marri" }]
keywords = ["mcp", "model-context-protocol", "agent-security", "tool-poisoning", "line-jumping", "static-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]
mcp = [
  "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/manumarri-sudo/skill-audit-2026"
Companion = "https://github.com/manumarri-sudo/mcp-line-jumping-demo"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
